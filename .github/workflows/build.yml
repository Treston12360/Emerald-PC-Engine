name: Native Emerald PC CI

# Compiles the original source-port engine, not copyrighted ROM content.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: ROM-free portable resource tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3
      - name: Run portable compatibility suites
        run: |
          bash tests/run_emerald_resource_lz.sh
          bash tests/run_emerald_rom_base_provider.sh

  linux-x64:
    name: Linux x64 native package
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils pkg-config libsdl2-dev libsdl2-image-dev \
            libpng-dev python3 python3-pil curl tar gzip zip file
      - name: Compile and package native Linux
        run: make -f Makefile_pc release-linux -j2
      - name: Verify ELF64 and package
        run: |
          test -s pokeemerald-linux64
          file pokeemerald-linux64
          readelf -h pokeemerald-linux64 | grep -Eq 'Class:[[:space:]]+ELF64'
          test -s release/pokeemerald-recomp-v0.1.0-alpha-linux-x64.tar.gz
          tar -tzf release/pokeemerald-recomp-v0.1.0-alpha-linux-x64.tar.gz | head -30
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-emerald-linux-x64
          path: release/pokeemerald-recomp-v0.1.0-alpha-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    name: Windows x64 native package (cross-compiled)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and asset toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils pkg-config gcc-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 libpng-dev python3 python3-pil \
            curl tar gzip zip file
      - name: Compile and package native Windows
        run: make -f Makefile_pc release-windows -j2
      - name: Verify x64 executable and ZIP
        run: |
          test -s PokemonEmeraldRecomp.exe
          file PokemonEmeraldRecomp.exe
          x86_64-w64-mingw32-objdump -f PokemonEmeraldRecomp.exe | grep -q 'pei-x86-64'
          test -s release/pokeemerald-recomp-v0.1.0-alpha-windows-x64.zip
          unzip -l release/pokeemerald-recomp-v0.1.0-alpha-windows-x64.zip | tail -20
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-emerald-windows-x64
          path: release/pokeemerald-recomp-v0.1.0-alpha-windows-x64.zip
          if-no-files-found: error
          retention-days: 14


  windows-smoke:
    name: Windows x64 loader smoke test (real Windows runner)
    needs: windows-x64
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Retrieve compiled Windows release ZIP
        uses: actions/download-artifact@v4
        with:
          name: vanilla-emerald-windows-x64
          path: artifact
      - name: Extract release
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path artifact -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw "No Windows release ZIP uploaded" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath extracted
          $exe = Get-ChildItem -Path extracted -Recurse -Filter 'pokeemerald-recomp.exe' | Select-Object -First 1
          if (-not $exe) { throw "No Windows executable in release" }
          Write-Host "Found executable: $($exe.FullName)"
      - name: Start executable and verify utility-mode exit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path extracted -Recurse -Filter 'pokeemerald-recomp.exe' | Select-Object -First 1
          if (-not $exe) { throw "No Windows executable in release" }
          $dataRoot = Join-Path $env:RUNNER_TEMP 'emerald-smoke-data'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          # This mode initializes SDL and storage, prints a path, and returns 0.
          # It does not require or distribute a commercial ROM.
          & $exe.FullName --data-root $dataRoot --print-data-path
          if ($LASTEXITCODE -ne 0) {
            throw "Windows native startup failed with exit code $LASTEXITCODE"
          }
          Write-Host 'Windows x64 executable successfully loaded and exited.'
